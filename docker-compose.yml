version: "3.9"

services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    volumes:
      - ./:/app
    command: ["python", "scripts/run_langgraph.py", "--max-iterations", "2"]

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    environment:
      - WORKSPACE_ROOT=/workspace
    volumes:
      - ./:/workspace
